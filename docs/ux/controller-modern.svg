      <path d="M139 274 C167 296 190 321 211 344" stroke="#99B0A4" stroke-opacity=".35" stroke-width="1" stroke-linecap="round"/>
    </g>
    <g id="right-grip" transform="translate(800 0) scale(-1 1)">
