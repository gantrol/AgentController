  </g>

  <g id="direction-pad" transform="translate(313 270)">
    <circle cy="1" r="41" fill="url(#well)" stroke="#CFD8D0"/>
    <path d="M-10 -33 H10 Q14 -33 14 -29 V-14 H29 Q33 -14 33 -10 V10 Q33 14 29 14 H14 V29 Q14 33 10 33 H-10 Q-14 33 -14 29 V14 H-29 Q-33 14 -33 10 V-10 Q-33 -14 -29 -14 H-14 V-29 Q-14 -33 -10 -33 Z"
          transform="translate(0 2)" fill="#6D8477"/>
    <path d="M-10 -33 H10 Q14 -33 14 -29 V-14 H29 Q33 -14 33 -10 V10 Q33 14 29 14 H14 V29 Q14 33 10 33 H-10 Q-14 33 -14 29 V14 H-29 Q-33 14 -33 10 V-10 Q-33 -14 -29 -14 H-14 V-29 Q-14 -33 -10 -33 Z"
