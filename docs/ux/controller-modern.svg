<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="800" height="540" viewBox="0 0 800 540" fill="none">
  <defs>
    <path id="body" d="M227 84 C183 77 149 97 133 135 C119 168 109 210 96 261 C86 305 75 407 96 444 C105 462 128 471 148 465 C172 458 190 436 216 405 L250 359 C261 342 278 334 299 335 C366 343 434 343 501 335 C522 334 539 342 550 359 L584 405 C610 436 628 458 652 465 C672 471 695 462 704 444 C725 407 714 305 704 261 C691 210 681 168 667 135 C651 97 617 77 573 84 C527 91 512 102 477 106 C429 112 371 112 323 106 C288 102 273 91 227 84 Z"/>
    <path id="grip" d="M136 259 C151 265 186 297 224 337 C229 343 229 350 223 359 L192 405 C175 429 157 449 142 453 C125 458 110 450 103 434 C87 399 97 313 105 277 C109 260 120 253 136 259 Z"/>
    <clipPath id="shell-clip"><use xlink:href="#body"/></clipPath>
