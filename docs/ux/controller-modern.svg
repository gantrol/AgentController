      <path d="M-4 -7 V5 H0 C6 5 6 -1 0 -1 H-4 M-4 -7 H0 C5 -7 5 -1 0 -1" stroke="#E4B8A9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
